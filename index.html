  <!-- El póster y el primer vuelo son lo primero que se ve: que el navegador los pida

  <style>
    /* Tema: fondo crema del diorama + acento verde esmeralda de rulocode. */
    :root, .sw-root {
      --sw-bg: #F4EAD5;          /* == color de fondo de las escenas (crema) */
      --sw-ink: #241C18;         /* casi-negro cálido (un punto más oscuro = más contraste) */
      --sw-ink-soft: #5F5346;    /* gris cálido más oscuro que el default → cuerpo/nav legibles */
      --sw-accent: #2E9C7B;      /* esmeralda — los acentos por sección lo sobreescriben */
    }

    /* ===== Legibilidad =====
       El texto oscuro sobre una escena clara y detallada no se sostiene con un
       degradado translúcido: el ojo compite con el diorama. Referencias como Cake
       Equity resuelven esto con una columna limpia y separada, no con superposición.
       Aquí el copy vive en un panel de fondo real (crema casi opaco + blur), así el
       contraste no depende de qué haya debajo en ese frame del vídeo. */

    /* Fuera el scrim: el panel ya garantiza el contraste y el degradado solo ensuciaba. */
    .sw-copylayer::before{ display:none; }

    .sw-copy{
      /* 460px obligaba al titular a romperse en 4-5 líneas cortas — de ahí el bulto.
         Con ~600px cae en 2-3 líneas y respira. */
      width:min(46vw,600px);
      background:color-mix(in srgb,var(--sw-bg) 94%,#fff);
      backdrop-filter:blur(18px) saturate(1.06);
      -webkit-backdrop-filter:blur(14px) saturate(1.08);
      border:1px solid color-mix(in srgb,var(--sw-ink) 8%,transparent);
      border-radius:24px;
      padding:30px 34px 34px;
      box-shadow:0 24px 70px -28px color-mix(in srgb,var(--sw-ink) 42%,transparent),
                 0 2px 8px -4px color-mix(in srgb,var(--sw-ink) 20%,transparent);
    }
    /* Sobre fondo opaco las sombras de texto solo emborronan: se eliminan todas. */
    .sw-copy__num{ color:color-mix(in srgb,var(--sw-ink) 62%,var(--sw-ink-soft)); text-shadow:none; }
    .sw-copy__eyebrow{
      margin-top:10px;
      color:color-mix(in srgb,var(--sw-accent) 42%,var(--sw-ink));
      text-shadow:none;
    }
    .sw-copy__title{
      font-size:clamp(1.9rem,3.3vw,3rem);
      line-height:1.06;
      text-wrap:balance;              /* reparte las líneas en vez de dejar viudas */
      color:var(--sw-ink);
      text-shadow:none;
    }
    .sw-copy__body{
      color:color-mix(in srgb,var(--sw-ink) 88%,var(--sw-ink-soft));
      max-width:52ch;                 /* medida cómoda de lectura */
      line-height:1.6;
      text-shadow:none;
    }
    /* Tags: texto oscuro sobre pastilla clara opaca */
    .sw-copy__tags li{
      color:color-mix(in srgb,var(--sw-accent) 40%,#000);
      background:color-mix(in srgb,var(--sw-accent) 15%,#fff);
      border-color:color-mix(in srgb,var(--sw-accent) 45%,transparent);
    }
    /* Barra superior: velo suave arriba + marca/nav con contraste garantizado */
    .sw-topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:150%;z-index:-1;pointer-events:none;
      background:linear-gradient(180deg,var(--sw-bg) 0%,color-mix(in srgb,var(--sw-bg) 45%,transparent) 60%,transparent 100%);}
    .sw-brand__name{ text-shadow:0 1px 10px color-mix(in srgb,var(--sw-bg) 82%,transparent); }
    .sw-nav__item{ color:color-mix(in srgb,var(--sw-ink) 72%,var(--sw-ink-soft)); }
    .sw-nav__item.is-active{ color:#fff; background:color-mix(in srgb,var(--sw-accent) 55%,var(--sw-ink)); }
    /* Foco visible de teclado (WCAG 2.4.7) */
    a:focus-visible,button:focus-visible{ outline:3px solid var(--sw-ink);outline-offset:3px;border-radius:8px; }

    /* ===== Móvil, pensado primero para el teléfono =====
       Dos problemas propios del formato vertical, que no existen en desktop:

       1. El clip es 16:9 y la pantalla ~9:19.5, así que `cover` se come cerca del
          75% del ancho. El encuadre queda centrado en el vacío que dejamos a la
          izquierda para el texto, y la acción se va fuera de pantalla. Se corrige
          moviendo el punto focal al sujeto, que vive en el tercio derecho.
       2. La tarjeta ocupaba el 48% del alto y caía justo sobre la escena. Los
          patrones móviles (SoFi, Superpower, Tolan) mantienen visual y texto en
          zonas separadas, con el texto breve y anclado abajo. */
    @media (max-width:860px){
      /* Centrado. Antes se desplazaba al 60% para perseguir al sujeto, porque los
         clips terminaban en un plano muy cerrado; ahora los clips móviles se cortan
         más lejos (al 55% del vuelo) y la escena entra entera, así que centrar es
         lo correcto y además queda equilibrado. */
      .sw-scene__video,.sw-scene__still{ object-position:50% 46%; }

      .sw-copy{
        width:auto;
        left:12px; right:12px;
        bottom:calc(20px + env(safe-area-inset-bottom));
        padding:16px 18px 18px;
        border-radius:20px;
        background:color-mix(in srgb,var(--sw-bg) 95%,#fff);
        box-shadow:0 18px 44px -22px color-mix(in srgb,var(--sw-ink) 55%,transparent);
      }
      /* El "01 / 07" es ruido cuando el espacio vertical es el recurso escaso. */
      .sw-copy__num{ display:none; }
      /* El eyebrow largo se partía en dos líneas y robaba una línea de titular. */
      .sw-copy__eyebrow{
        margin-top:0; font-size:.68rem; letter-spacing:.1em;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      }
      .sw-copy__title{ font-size:clamp(1.4rem,5.6vw,1.95rem);line-height:1.14;margin-top:7px; }
      .sw-copy__body{
        font-size:.94rem;line-height:1.45;margin-top:10px;max-width:none;
        /* Con el copy ya acortado no debería recortar nunca; queda como red de
           seguridad para traducciones o textos más largos. */
        display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
      }
      .sw-copy__tags{ margin-top:12px;gap:6px; }
      .sw-copy__tags li{ font-size:.72rem;padding:5px 11px; }
      .sw-copy__tags li:nth-child(n+3){ display:none; }   /* dos etiquetas bastan */
      .sw-copy__cta{ margin-top:14px; }
      /* El rail lateral se cruzaba por encima de la tarjeta y su etiqueta activa
         flotaba sobre la escena. En vertical no hay ancho para las dos cosas, y
         arriba ya existe una barra de progreso que cumple la misma función. */
      .sw-route{ display:none; }
      /* En móvil el gesto de scroll es evidente y el hint chocaba con la tarjeta. */
      .sw-hint{ display:none; }

      /* Teléfonos cortos (SE, mini): recortar aún más antes que desbordar. */
      @media (max-height:700px){
        .sw-copy__title{ font-size:clamp(1.3rem,5.2vw,1.7rem); }
        .sw-copy__body{ -webkit-line-clamp:3;font-size:.9rem; }
        .sw-copy__tags{ display:none; }
      }
    }
  </style>

<body>
