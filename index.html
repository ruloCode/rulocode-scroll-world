  <style>
    /* Tema: fondo crema del diorama + acento verde esmeralda de rulocode. */
    :root, .sw-root {
      --sw-bg: #F4EAD5;          /* == color de fondo de las escenas (crema) */
      --sw-ink: #241C18;         /* casi-negro cálido (un punto más oscuro = más contraste) */
      --sw-ink-soft: #5F5346;    /* gris cálido más oscuro que el default → cuerpo/nav legibles */
      --sw-accent: #2E9C7B;      /* esmeralda — los acentos por sección lo sobreescriben */
    }

    /* ===== Legibilidad + accesibilidad (sin @layer → gana a los defaults del motor) ===== */

    /* Scrim desktop: más opaco y ancho, el texto oscuro asienta sobre crema */
    .sw-copylayer::before{
      width:min(62vw,880px);
      background:linear-gradient(90deg,
        var(--sw-bg) 0%,
        color-mix(in srgb,var(--sw-bg) 94%,transparent) 46%,
        color-mix(in srgb,var(--sw-bg) 62%,transparent) 72%,
        transparent 100%);
    }
    /* Eyebrow: acento oscurecido hacia la tinta → pasa AA (ocre/teal crudos fallaban) */
    .sw-copy__eyebrow{
      color:color-mix(in srgb,var(--sw-accent) 46%,var(--sw-ink));
      text-shadow:0 1px 10px color-mix(in srgb,var(--sw-bg) 82%,transparent);
    }
    /* Cuerpo + número: tinta más plena y halo crema para separar de la escena */
    .sw-copy__body{
      color:color-mix(in srgb,var(--sw-ink) 92%,var(--sw-ink-soft));
      text-shadow:0 1px 2px var(--sw-bg),0 2px 14px color-mix(in srgb,var(--sw-bg) 78%,transparent);
    }
    .sw-copy__num{ color:color-mix(in srgb,var(--sw-ink) 75%,var(--sw-ink-soft)); }
    .sw-copy__title{ text-shadow:0 2px 22px color-mix(in srgb,var(--sw-bg) 84%,transparent),0 1px 2px color-mix(in srgb,var(--sw-bg) 60%,transparent); }
    /* Tags: texto oscuro sobre pastilla clara opaca */
    .sw-copy__tags li{
      color:color-mix(in srgb,var(--sw-accent) 40%,#000);
      background:color-mix(in srgb,var(--sw-accent) 15%,#fff);
      border-color:color-mix(in srgb,var(--sw-accent) 45%,transparent);
    }
    /* Barra superior: velo suave arriba + marca/nav con contraste garantizado */
    .sw-topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:150%;z-index:-1;pointer-events:none;
      background:linear-gradient(180deg,var(--sw-bg) 0%,color-mix(in srgb,var(--sw-bg) 45%,transparent) 60%,transparent 100%);}
    .sw-brand__name{ text-shadow:0 1px 10px color-mix(in srgb,var(--sw-bg) 82%,transparent); }
    .sw-nav__item{ color:color-mix(in srgb,var(--sw-ink) 72%,var(--sw-ink-soft)); }
    .sw-nav__item.is-active{ color:#fff; background:color-mix(in srgb,var(--sw-accent) 55%,var(--sw-ink)); }
    /* Foco visible de teclado (WCAG 2.4.7) */
    a:focus-visible,button:focus-visible{ outline:3px solid var(--sw-ink);outline-offset:3px;border-radius:8px; }

    /* Móvil: aquí estaba el peor contraste — scrim más alto/opaco + texto algo mayor */
    @media (max-width:860px){
      .sw-copylayer::before{
        width:100%;height:76%;top:auto;bottom:0;
        background:linear-gradient(0deg,
          var(--sw-bg) 0%,
          var(--sw-bg) 22%,
          color-mix(in srgb,var(--sw-bg) 90%,transparent) 52%,
          color-mix(in srgb,var(--sw-bg) 42%,transparent) 80%,
          transparent 100%);
      }
      .sw-copy__title{ font-size:clamp(2rem,7.8vw,2.8rem);line-height:1.05; }
      .sw-copy__body{ font-size:clamp(1.02rem,4vw,1.16rem);line-height:1.5; }
      .sw-copy__eyebrow{ font-size:.84rem; }
    }
  </style>
